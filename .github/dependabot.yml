# Свежие зависимости без ручной слежки: раз в неделю один общий pull request на uv.lock
# (так уязвимость вроде старого certifi не залежится), раз в месяц — на действия GitHub Actions.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns: ["*"]
    # Наборы people и people-legacy держат разные версии этих пакетов (legacy — для macOS 11–13),
    # а Dependabot пытается поднять их одной версией для обоих и падает. Обновлять их — вручную.
    ignore:
      - dependency-name: "av"
      - dependency-name: "numpy"
      - dependency-name: "onnxruntime"
      - dependency-name: "onnxruntime-directml"
      - dependency-name: "scipy"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]

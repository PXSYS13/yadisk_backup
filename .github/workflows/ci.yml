name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Lint
        run: uv run --locked --python ${{ matrix.python-version }} ruff check .

      - name: Tests
        run: uv run --locked --python ${{ matrix.python-version }} pytest -q
        env:
          # open() без encoding= на Windows-раннерах (cp1252) уже ломал CI — ловим класс ошибки целиком
          PYTHONWARNDEFAULTENCODING: "1"

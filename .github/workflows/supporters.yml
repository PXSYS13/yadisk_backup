# «Нас поддерживают»: раз в 15 минут забирает донаты из DonationAlerts в supporters.json.
# Ключ — секрет репозитория DONATIONALERTS_TOKEN (python tools/sync_supporters.py --get-token).
# Без секрета запуск ничего не делает. Коммит от GITHUB_TOKEN не запускает CI.
name: supporters

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supporters
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'PXSYS13/yadisk_backup'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Обновить список
        env:
          DONATIONALERTS_TOKEN: ${{ secrets.DONATIONALERTS_TOKEN }}
        run: python tools/sync_supporters.py

      - name: Сохранить, если изменился
        run: |
          if git diff --quiet -- supporters.json; then
            echo "Список не изменился"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supporters.json
          git commit -m "chore: update supporters list"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep 5
          done
          exit 1

[project]
name = "yadisk-backup"
version = "2.8.1"
description = "Бесплатная программа, которая сохраняет на компьютер весь Яндекс.Диск и безлимит фото"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "markdown>=3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.32.0",
    "yadisk[sync_defaults]>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    # TestClient: Starlette 1.x работает на httpx2 (он только для Python 3.11+); на 3.10 — прежний httpx
    "httpx2>=2.0.0; python_version >= '3.11'",
    "httpx>=0.27.0; python_version < '3.11'",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:state",
    "error::DeprecationWarning:utils",
    "error::DeprecationWarning:downloader",
    "error::DeprecationWarning:webapp",
    "error::EncodingWarning",
    # Python 3.10: httpx2 не ставится, Starlette предупреждает о прежнем httpx — это про тесты, не про программу
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:UserWarning",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

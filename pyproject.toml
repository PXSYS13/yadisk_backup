[project]
name = "yadisk-backup"
version = "2.2.0"
description = "Быстрый многопоточный бэкап Яндекс.Диска с веб-дашбордом и поддержкой безлимита"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115.0",
    "markdown>=3.6",
    "python-dotenv>=1.2.3",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.32.0",
    "yadisk[sync_defaults]>=3.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning:state",
    "error::DeprecationWarning:utils",
    "error::DeprecationWarning:downloader",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

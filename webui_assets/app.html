<script>
  // Тема — до отрисовки, чтобы не мигало: сохранённый выбор или тема системы
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('yadisk-theme'); } catch (e) { /* приватный режим */ }
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
